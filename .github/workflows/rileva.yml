name: Rileva fonti

# Si lancia solo a mano (Actions -> "Rileva fonti" -> Run workflow).
# Cerca dove pubblicano le offerte le aziende in rileva_fonti.py e salva report_fonti.csv.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  rileva:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installa dipendenze
        run: pip install requests
      - name: Rileva le fonti
        run: python rileva_fonti.py
      - name: Salva il report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add report_fonti.csv
          git commit -m "Report fonti $(date -u +'%Y-%m-%d %H:%M')" || echo "Niente da salvare"
          git pull --rebase origin main
          git push
