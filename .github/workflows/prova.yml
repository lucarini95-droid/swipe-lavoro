name: Prova portali

# Si lancia solo a mano. Prova metodi nuovi sui portali che monitor.py non legge
# e stampa nel log cosa trova (non salva niente).
on:
  workflow_dispatch: {}

jobs:
  prova:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python prova_portali.py
