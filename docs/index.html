<!doctype html>
<!--
  SWIPE LAVORO - pagina che mostra le offerte una alla volta (tipo Tinder).

  Come funziona, in breve:
    1. GitHub Actions lancia monitor.py due volte al giorno e scrive docs/jobs.json
    2. Questa pagina scarica jobs.json e mostra le offerte non ancora decise
    3. Destra = salva, sinistra = scarta. Le scelte restano nel browser (localStorage)
    4. Ogni offerta ha da 0 a 5 stelle, calcolate da monitor.py (vedi PESI lì)

  Struttura del file:
    HEAD    impostazioni per telefono (icona, schermo intero) + stile (CSS)
    BODY    lo scheletro della pagina: intestazione, tab, mazzo, lista salvate
    SCRIPT  la logica, divisa in blocchi numerati (1 ... 8) con un titolo ciascuno

  Per cambiare qualcosa: cerca il blocco giusto, modifica, aggiorna VERSIONE
  (blocco 1 della logica) e annota il cambio in CHANGELOG.md.
-->
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Swipe Lavoro</title>
<meta name="robots" content="noindex">

<!-- Telefono: icona sulla schermata Home e apertura a schermo intero come un'app -->
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Swipe Lavoro">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#16624a">

<style>
/* ===== Colori: modifica qui per cambiare tema (chiaro sopra, scuro sotto) ===== */
:root{
  --bg:#f4f1ea; --card:#fffdf8; --ink:#1d1b18; --muted:#6f6a61; --line:#e4ded2;
  --green:#1f7a4d; --green-bg:#e3f2e9; --red:#b3402f; --red-bg:#f8e4df;
  --accent:#16624a; --chip:#efe9dd; --shadow:0 18px 40px -18px rgba(40,30,10,.35);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#151513; --card:#1f1f1c; --ink:#eeeae2; --muted:#a29d93; --line:#33322e;
  --green:#58c08b; --green-bg:#1d3327; --red:#e57b69; --red-bg:#3a221d;
  --accent:#6fcca0; --chip:#2b2a26; --shadow:0 18px 40px -18px rgba(0,0,0,.8);
}}

/* ===== Impaginazione generale ===== */
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;
  -webkit-font-smoothing:antialiased}
body{min-height:100dvh;display:flex;flex-direction:column;align-items:center;
  padding:max(14px,env(safe-area-inset-top)) 16px max(18px,env(safe-area-inset-bottom))}
.wrap{width:100%;max-width:520px;display:flex;flex-direction:column;flex:1}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
h1{font-size:19px;margin:0;letter-spacing:-.01em}
.upd{font-size:12px;color:var(--muted);text-align:right}
.tabs{display:flex;gap:6px;background:var(--chip);padding:4px;border-radius:12px;margin-bottom:14px}
.tabs button{flex:1;border:0;background:none;color:var(--muted);font:inherit;font-weight:600;
  padding:8px;border-radius:9px;cursor:pointer}
.tabs button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.n{font-weight:500;opacity:.7;margin-left:4px}

/* ===== Mazzo di carte (vista "Da vedere") ===== */
.deck{position:relative;flex:1;min-height:440px}
.card{position:absolute;inset:0;background:var(--card);border:1px solid var(--line);
  border-radius:20px;box-shadow:var(--shadow);display:flex;flex-direction:column;
  overflow:hidden;touch-action:pan-y;user-select:none;will-change:transform}
.card.back{transform:scale(.95) translateY(14px);opacity:.6;pointer-events:none}
.card.anim{transition:transform .28s ease,opacity .28s ease}
.card .top{padding:20px 20px 12px}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;min-height:22px}
.b{font-size:11.5px;font-weight:700;letter-spacing:.02em;padding:3px 9px;border-radius:99px;
  background:var(--chip);color:var(--muted)}
.b.new{background:var(--accent);color:var(--card)}
.b.it{background:var(--green-bg);color:var(--green)}
.b.extra{background:var(--red-bg);color:var(--red)}
/* stelle 0-5 e motivi del punteggio */
.stars{font-size:19px;letter-spacing:2px;color:#d39a1c;line-height:1;margin-bottom:8px}
.stars .off{color:var(--line)}
.why{font-size:12px;color:var(--muted);margin-top:6px}
.row .stars{font-size:13px;letter-spacing:1px;margin:0 0 2px}
.az{font-size:13px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.05em}
.tit{font-size:22px;line-height:1.25;font-weight:700;margin:4px 0 6px;letter-spacing:-.01em}
.loc{font-size:13.5px;color:var(--muted)}
.desc{flex:1;overflow:auto;padding:4px 20px 16px;font-size:14px;color:var(--muted);
  white-space:pre-line;border-top:1px solid var(--line);margin-top:6px;padding-top:14px}
.desc.empty{font-style:italic}
.open{display:block;margin:0 20px 18px;text-align:center;padding:11px;border-radius:12px;
  border:1px solid var(--line);color:var(--ink);text-decoration:none;font-weight:600}
.open:hover{background:var(--chip)}
.stamp{position:absolute;top:22px;font-size:20px;font-weight:800;letter-spacing:.06em;
  padding:4px 12px;border:3px solid;border-radius:10px;opacity:0;pointer-events:none}
.stamp.yes{left:18px;color:var(--green);transform:rotate(-12deg)}
.stamp.no{right:18px;color:var(--red);transform:rotate(12deg)}

.actions{display:flex;justify-content:center;align-items:center;gap:22px;margin:18px 0 6px}
.act{width:64px;height:64px;border-radius:50%;border:1px solid var(--line);background:var(--card);
  font-size:26px;cursor:pointer;box-shadow:var(--shadow);display:grid;place-items:center;
  transition:transform .12s}
.act:active{transform:scale(.92)}
.act.no{color:var(--red)} .act.yes{color:var(--green)}
.act.undo{width:46px;height:46px;font-size:19px;color:var(--muted)}
.act:disabled{opacity:.35;cursor:default}
.hint{text-align:center;font-size:12px;color:var(--muted)}

.empty-state{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;text-align:center;color:var(--muted);padding:30px;
  border:2px dashed var(--line);border-radius:20px}
.empty-state b{color:var(--ink);font-size:18px;display:block;margin-bottom:6px}

/* ===== Lista offerte salvate (vista "Salvate") ===== */
/* filtri in alto: Da candidarmi / In corso / Chiuse */
.seg{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto}
.seg button{border:1px solid var(--line);background:var(--card);color:var(--muted);font:inherit;font-size:13px;
  font-weight:600;padding:7px 12px;border-radius:99px;cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.list{display:flex;flex-direction:column;gap:10px}
.row{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.row .head{display:flex;gap:10px;align-items:flex-start;padding:14px 14px 12px;cursor:pointer}
.row .main{flex:1;min-width:0}
.row .az2{font-size:11.5px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.05em}
.row .t{font-weight:650;line-height:1.3;margin:2px 0 3px}
.row .meta{font-size:12.5px;color:var(--muted)}
.row .chev{color:var(--muted);font-size:14px;padding-top:2px;transition:transform .2s}
.row.aperta .chev{transform:rotate(90deg)}
.row .stars{font-size:13px;letter-spacing:1px;margin:0 0 3px}
.closed{color:var(--red);font-weight:600}
/* pillola di stato (in realtà un menu a tendina nativo: comodo sul telefono) */
.st{appearance:none;-webkit-appearance:none;border:0;font:inherit;font-size:12px;font-weight:700;
  padding:5px 10px;border-radius:99px;cursor:pointer;background:var(--chip);color:var(--ink);max-width:150px}
.st.da_fare{background:var(--chip);color:var(--ink)}
.st.candidato{background:#e2ecfb;color:#2856a3}
.st.colloquio{background:#fbefd9;color:#9a6408}
.st.offerta{background:var(--green-bg);color:var(--green)}
.st.rifiutato,.st.ritirata{background:var(--red-bg);color:var(--red)}
@media (prefers-color-scheme:dark){.st.candidato{background:#1e2c44;color:#8fb4f0}.st.colloquio{background:#3a2e17;color:#e8b65c}}
/* dettaglio che si apre toccando la riga */
.det{border-top:1px solid var(--line);padding:12px 14px 14px;display:flex;flex-direction:column;gap:12px}
.det h4{margin:0 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.det .d{font-size:13px;color:var(--muted);white-space:pre-line;max-height:160px;overflow:auto}
.det textarea{width:100%;min-height:64px;padding:9px 10px;border-radius:10px;border:1px solid var(--line);
  background:var(--bg);color:var(--ink);font:inherit;font-size:13.5px;resize:vertical}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 11px;border-radius:10px;border:1px solid var(--line);
  background:var(--card);color:var(--ink);font:inherit;font-size:13px;font-weight:600;text-decoration:none;cursor:pointer}
.btn:hover{background:var(--chip)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--card)}
.btn.del{color:var(--red)}
.mini{font-size:12px;color:var(--muted)}
.lang{display:inline-flex;gap:2px;background:var(--chip);border-radius:8px;padding:2px;margin-left:6px}
.lang button{border:0;background:none;font:inherit;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:6px;color:var(--muted);cursor:pointer}
.lang button.on{background:var(--card);color:var(--ink)}
/* avviso in basso con "Annulla" dopo una rimozione */
.toast{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);
  background:var(--ink);color:var(--card);padding:10px 14px;border-radius:12px;font-size:13.5px;
  display:flex;gap:14px;align-items:center;box-shadow:var(--shadow);z-index:9}
.toast button{border:0;background:none;color:var(--accent);font:inherit;font-weight:700;cursor:pointer;filter:brightness(1.6)}

/* ===== Sincronizzazione ===== */
.sync{border:0;background:none;color:var(--muted);font:inherit;font-size:12px;cursor:pointer;padding:0}
.sync.ok{color:var(--green)} .sync.err{color:var(--red)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px;font-size:13.5px}
.panel p{margin:6px 0;color:var(--muted)}
.panel input{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.prow{display:flex;gap:8px;margin-top:8px}
.prow button{flex:1;padding:9px;border-radius:10px;border:0;background:var(--accent);color:var(--card);font:inherit;font-weight:600;cursor:pointer}
.prow button.ghost{background:var(--chip);color:var(--ink)}
.pmsg{font-size:12.5px}

/* ===== Piè di pagina ===== */
footer{margin-top:18px;font-size:11.5px;color:var(--muted);text-align:center}
footer details{margin-top:6px;text-align:left}
footer summary{cursor:pointer;text-align:center}
footer ul{padding-left:18px;margin:6px 0}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <!-- Intestazione: titolo + quando è stata fatta l'ultima ricerca -->
  <header>
    <h1>🍀 Swipe Dublino</h1>
    <div class="upd"><span id="upd">carico…</span><br>
      <button class="sync" id="b-sync" title="Sincronizzazione tra dispositivi">☁︎ <span id="sync-txt">…</span></button></div>
  </header>

  <!-- Pannello sincronizzazione: si apre toccando "☁︎" nell'intestazione -->
  <div class="panel hidden" id="panel">
    <b>Sincronizzazione tra telefono e Mac</b>
    <p>Incolla qui il token GitHub (vedi README → <i>Sincronizzazione</i>). Resta solo in questo browser.</p>
    <input id="tok" type="password" placeholder="github_pat_…" autocomplete="off">
    <div class="prow"><button id="tok-save">Salva e sincronizza</button><button id="tok-del" class="ghost">Scollega</button></div>
    <p id="panel-msg" class="pmsg"></p>
  </div>

  <!-- Le due schede: mazzo da vedere / lista salvate -->
  <nav class="tabs">
    <button id="t-deck" class="on">Da vedere<span class="n" id="n-deck"></span></button>
    <button id="t-saved">Salvate<span class="n" id="n-saved"></span></button>
  </nav>

  <!-- Vista 1: il mazzo di carte e i pulsanti scarta / annulla / salva -->
  <section id="v-deck" style="display:flex;flex-direction:column;flex:1">
    <div class="deck" id="deck"></div>
    <div class="actions">
      <button class="act no" id="b-no" title="Scarta (←)">✕</button>
      <button class="act undo" id="b-undo" title="Annulla (Z)">↶</button>
      <button class="act yes" id="b-yes" title="Salva (→)">★</button>
    </div>
    <div class="hint">Trascina o usa ← → · Z per annullare</div>
  </section>

  <!-- Vista 2: le offerte salvate -->
  <section id="v-saved" class="hidden">
    <div class="seg" id="seg"></div>
    <div class="list" id="saved"></div>
  </section>

  <!-- Piè di pagina: numeri, scartate per lingua, aziende non lette, versione -->
  <footer id="foot"></footer>
</div>

<script>
/* =====================================================================
   1. IMPOSTAZIONI
   ===================================================================== */
const VERSIONE = "1.6";            // mostrata in fondo alla pagina; aggiornala a ogni modifica
const KEY = "swipe-lavoro-v1";     // nome della memoria nel browser (cambiarlo = ripartire da zero)
const SOGLIA_SWIPE = 110;          // pixel di trascinamento oltre i quali la carta parte
const GIORNI_NUOVA = 2;            // un'offerta è "NUOVA" se comparsa da al massimo N giorni

// Sincronizzazione (blocco 8): dove salvare le scelte comuni a tutti i dispositivi.
// Il file sta su un ramo separato ("decisioni") così ogni swipe non ricostruisce la pagina.
const SYNC_REPO   = "lucarini95-droid/swipe-lavoro";
const SYNC_BRANCH = "decisioni";
const SYNC_FILE   = "decisioni.json";
const SYNC_ATTESA = 2500;          // ms di attesa dopo l'ultimo swipe prima di inviare (raggruppa più swipe)
const KEY_TOKEN   = "swipe-lavoro-token";

/* =====================================================================
   2. STATO E MEMORIA DEL BROWSER
   jobs    = offerte attive lette da jobs.json
   meta    = il resto di jobs.json (data aggiornamento, problemi, scartate)
   history = ordine delle decisioni prese in questa sessione (serve per "Annulla")
   state.dec = { idOfferta: { s:"salvata"|"scartata"|"annullata", t:data, cand:bool, ...dati } }
               Le salvate tengono anche titolo/azienda/link, così restano
               visibili anche quando l'annuncio viene chiuso.
               "annullata" = decisione tolta con Annulla: non si cancella la riga ma
               la si marca, così la sincronizzazione sa che è più recente della vecchia.
               Ogni modifica aggiorna t: tra due dispositivi vince la t più recente.
   ===================================================================== */
let jobs = [], meta = {}, history = [];
let state = load();

function load(){
  try { return JSON.parse(localStorage.getItem(KEY)) || {dec:{}}; }
  catch(e){ return {dec:{}}; }      // browser in modalità privata: si lavora senza memoria
}
// salva nel browser e programma l'invio a GitHub (blocco 8)
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){}
  if(typeof programmaInvio === "function") programmaInvio();
}
const adesso = () => new Date().toISOString();

/* =====================================================================
   3. PICCOLI AIUTI
   ===================================================================== */
const $ = id => document.getElementById(id);
// evita che testi strani negli annunci rompano la pagina
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function giorniDa(d){                 // d = "2026-10-09" -> giorni trascorsi, null se vuota
  if(!d) return null;
  return Math.floor((Date.now() - new Date(d+"T00:00:00Z")) / 864e5);
}
function quando(d){                   // testo "comparsa oggi / ieri / N giorni fa"
  const g = giorniDa(d);
  if(g === null) return "online da prima dell'avvio";
  if(g <= 0) return "comparsa oggi";
  if(g === 1) return "comparsa ieri";
  return `comparsa ${g} giorni fa`;
}
function fa(iso){                     // "aggiornato 3 ore fa"
  const m = Math.round((Date.now() - new Date(iso)) / 6e4);
  if(m < 60) return `${m} min fa`;
  const h = Math.round(m/60);
  if(h < 36) return `${h} ore fa`;
  return `${Math.round(h/24)} giorni fa`;
}

// "★★★★☆": stelle piene + vuote (le offerte vecchie senza stelle non ne mostrano)
function stelleHTML(n){
  if(n === undefined || n === null) return "";
  return `<div class="stars" title="${n} stelle su 5">${"★".repeat(n)}<span class="off">${"★".repeat(5-n)}</span></div>`;
}

// offerte ancora da decidere, nell'ordine di jobs.json (più stelle prima, poi più nuove)
const deciso = id => state.dec[id] && state.dec[id].s !== "annullata";
const daVedere = () => jobs.filter(j => !deciso(j.id));
// offerte salvate: più stelle prima, poi le salvate più di recente (i gruppi li fanno i filtri, blocco 6)
const salvate = () => Object.entries(state.dec)
  .filter(([,v]) => v.s === "salvata")
  .map(([id,v]) => ({id, ...v}))
  .sort((a,b) => (b.stelle??-1)-(a.stelle??-1) || (b.ts||b.t||"").localeCompare(a.ts||a.t||""));

/* =====================================================================
   4. MAZZO DI CARTE
   Si disegnano solo le prime 2 carte: quella in cima e quella sotto
   (che si intravede). Dopo ogni decisione si ridisegna tutto.
   ===================================================================== */
function cardHTML(j){
  const g = giorniDa(j.prima_vista);
  const badges = [
    g !== null && g <= GIORNI_NUOVA ? `<span class="b new">NUOVA</span>` : "",
    j.italiano ? `<span class="b it">🇮🇹 Italiano</span>` : "",
    // lingue richieste in più insieme all'italiano (es. "Italian & Spanish")
    ...(j.altre_lingue || []).map(l => `<span class="b extra">+ ${esc(l)}</span>`),
  ].join("");
  return `
    <div class="stamp yes">SALVA</div><div class="stamp no">SCARTA</div>
    <div class="top">
      ${stelleHTML(j.stelle)}
      <div class="badges">${badges}</div>
      <div class="az">${esc(j.azienda)}</div>
      <div class="tit">${esc(j.titolo)}</div>
      <div class="loc">📍 ${esc(j.luogo)} · ${quando(j.prima_vista)}</div>
      ${(j.motivi || []).length ? `<div class="why">${j.motivi.map(esc).join(" · ")}</div>` : ""}
    </div>
    <div class="desc ${j.descrizione ? "" : "empty"}">${j.descrizione ? esc(j.descrizione) : "Descrizione non disponibile da questo portale: apri l'annuncio."}</div>
    <a class="open" href="${esc(j.url)}" target="_blank" rel="noopener">Apri annuncio ↗</a>`;
}

function render(){
  const coda = daVedere();
  const deck = $("deck");
  deck.innerHTML = "";
  if(!coda.length){
    deck.innerHTML = `<div class="empty-state"><div><b>Hai visto tutto 🎉</b>
      Le nuove offerte arrivano da sole due volte al giorno.<br>Ultimo controllo: ${meta.aggiornato ? fa(meta.aggiornato) : "—"}.</div></div>`;
  } else {
    coda.slice(0,2).reverse().forEach((j,i,arr) => {
      const el = document.createElement("article");
      el.className = "card" + (i === 0 && arr.length > 1 ? " back" : "");
      el.innerHTML = cardHTML(j);
      el.dataset.id = j.id;
      deck.appendChild(el);
    });
    attachDrag(deck.lastElementChild);   // solo la carta in cima si trascina
  }
  $("b-no").disabled = $("b-yes").disabled = !coda.length;
  $("b-undo").disabled = !history.length;
  $("n-deck").textContent = coda.length;
  $("n-saved").textContent = salvate().filter(v => !["rifiutato","ritirata"].includes(statoDi(v))).length || "";
  renderSaved();
}

/* =====================================================================
   5. DECISIONI: salva, scarta, annulla, trascinamento
   ===================================================================== */
// stato = "salvata" | "scartata";  dir = 1 (vola a destra) | -1 (vola a sinistra)
function decidi(stato, dir){
  const card = $("deck").lastElementChild;
  if(!card || !card.classList.contains("card")) return;
  const j = jobs.find(x => x.id === card.dataset.id);
  if(!j) return;
  history.push(j.id);
  state.dec[j.id] = stato === "salvata"
    ? {s:stato, t:adesso(), ts:adesso(), stato:"da_fare", azienda:j.azienda, titolo:j.titolo, url:j.url, luogo:j.luogo, stelle:j.stelle}
    : {s:stato, t:new Date().toISOString()};
  save();
  // animazione di uscita, poi si ridisegna il mazzo
  card.classList.add("anim");
  card.style.transform = `translate(${dir*innerWidth}px, 40px) rotate(${dir*24}deg)`;
  card.style.opacity = "0";
  const back = card.previousElementSibling;
  if(back){ back.classList.add("anim"); back.classList.remove("back"); }
  setTimeout(render, 260);
}

// toglie l'ultima decisione presa e rimette quella carta in cima al mazzo
function annulla(){
  const id = history.pop();
  if(!id) return;
  state.dec[id] = {s:"annullata", t:adesso()}; save();
  const i = jobs.findIndex(j => j.id === id);
  if(i > -1) jobs.unshift(jobs.splice(i,1)[0]);
  render();
}

// trascinamento con dito o mouse; oltre SOGLIA_SWIPE la carta parte
function attachDrag(card){
  let x0=0, y0=0, dx=0, drag=false, id=null;
  const yes = card.querySelector(".stamp.yes"), no = card.querySelector(".stamp.no");
  card.addEventListener("pointerdown", e => {
    // non trascinare se si clicca il link o si seleziona il testo col mouse
    if(e.target.closest("a") || e.target.closest(".desc") && e.pointerType === "mouse") return;
    drag = true; id = e.pointerId; x0 = e.clientX; y0 = e.clientY; dx = 0;
    card.classList.remove("anim");
  });
  card.addEventListener("pointermove", e => {
    if(!drag || e.pointerId !== id) return;
    dx = e.clientX - x0; const dy = e.clientY - y0;
    // movimento orizzontale = swipe; verticale = lascia scorrere la descrizione
    if(Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy)) card.setPointerCapture(id);
    card.style.transform = `translate(${dx}px, ${dy*0.15}px) rotate(${dx/18}deg)`;
    yes.style.opacity = Math.max(0, Math.min(1, dx/SOGLIA_SWIPE));
    no.style.opacity = Math.max(0, Math.min(1, -dx/SOGLIA_SWIPE));
  });
  const end = () => {
    if(!drag) return; drag = false;
    if(dx > SOGLIA_SWIPE) return decidi("salvata", 1);
    if(dx < -SOGLIA_SWIPE) return decidi("scartata", -1);
    card.classList.add("anim"); card.style.transform = ""; yes.style.opacity = no.style.opacity = 0;
  };
  card.addEventListener("pointerup", end);
  card.addEventListener("pointercancel", end);
}

/* =====================================================================
   6. LISTA SALVATE: stato candidatura, note, raccomandazione, rimuovi
   Ogni salvata ha uno "stato" (vedi STATI). I vecchi dati con la sola spunta
   "Candidato" (cand:true) vengono letti come stato "candidato".
   I filtri in alto raggruppano gli stati in tre gruppi (GRUPPI).
   ===================================================================== */
const STATI = [
  ["da_fare",   "Da candidarmi"],
  ["candidato", "Candidato"],
  ["colloquio", "Colloquio"],
  ["offerta",   "Offerta 🎉"],
  ["rifiutato", "Rifiutato"],
  ["ritirata",  "Non mi interessa"],
];
const GRUPPI = [
  ["da_fare", "Da candidarmi", ["da_fare"]],
  ["corso",   "In corso",      ["candidato","colloquio","offerta"]],
  ["chiuse",  "Chiuse",        ["rifiutato","ritirata"]],
];
let gruppo = "da_fare";            // filtro attivo
const aperte = new Set();          // righe con il dettaglio aperto
const statoDi = v => v.stato || (v.cand ? "candidato" : "da_fare");

function giorniFaTesto(iso){
  if(!iso) return "";
  const g = Math.floor((Date.now() - new Date(iso)) / 864e5);
  return g <= 0 ? "oggi" : g === 1 ? "ieri" : `${g} giorni fa`;
}

function renderSaved(){
  const attivi = new Map(jobs.map(j => [j.id, j]));
  const tutte = salvate();
  // se il filtro attivo è vuoto ma un altro no, si passa al primo non vuoto
  const conta = g => tutte.filter(v => GRUPPI.find(x => x[0] === g)[2].includes(statoDi(v))).length;
  $("seg").innerHTML = GRUPPI.map(([k, nome]) =>
    `<button data-g="${k}" class="${k === gruppo ? "on" : ""}">${nome} <span class="n">${conta(k) || ""}</span></button>`).join("");

  const stati = GRUPPI.find(x => x[0] === gruppo)[2];
  const list = tutte.filter(v => stati.includes(statoDi(v)));
  $("saved").innerHTML = list.length ? list.map(v => rigaHTML(v, attivi.get(v.id), attivi.size)).join("")
    : `<div class="empty-state" style="position:static;min-height:180px">${
        tutte.length ? "Niente in questo gruppo." : "Nessuna offerta salvata.<br>Scorri a destra quelle che ti interessano."}</div>`;
}

function rigaHTML(v, j, ciSonoDati){
  const st = statoDi(v), aperta = aperte.has(v.id);
  const chiuso = ciSonoDati && !j;
  const quandoTesto = st === "da_fare" ? `salvata ${giorniFaTesto(v.ts || v.t)}`
                    : v.tc ? `candidato ${giorniFaTesto(v.tc)}` : "";
  return `
  <div class="row ${aperta ? "aperta" : ""}" data-id="${esc(v.id)}">
    <div class="head" data-toggle="${esc(v.id)}">
      <div class="main">
        ${stelleHTML(v.stelle ?? j?.stelle)}
        <div class="az2">${esc(v.azienda)}</div>
        <div class="t">${esc(v.titolo)}</div>
        <div class="meta">${esc(v.luogo || "")}${quandoTesto ? " · " + quandoTesto : ""}
          ${chiuso ? ` · <span class="closed">annuncio chiuso</span>` : ""}${v.note ? " · 📝" : ""}</div>
      </div>
      <select class="st ${st}" data-s="${esc(v.id)}" aria-label="Stato candidatura">
        ${STATI.map(([k, n]) => `<option value="${k}" ${k === st ? "selected" : ""}>${n}</option>`).join("")}
      </select>
      <span class="chev">›</span>
    </div>
    ${aperta ? dettaglioHTML(v, j) : ""}
  </div>`;
}

function dettaglioHTML(v, j){
  return `
    <div class="det">
      <div class="btns">
        <a class="btn pri" href="${esc(v.url)}" target="_blank" rel="noopener">Apri annuncio ↗</a>
        <button class="btn del" data-r="${esc(v.id)}">Rimuovi</button>
      </div>
      ${j && j.descrizione ? `<div><h4>Annuncio</h4><div class="d">${esc(j.descrizione)}</div></div>` : ""}
      ${(typeof raccomandazioneHTML === "function") ? raccomandazioneHTML(v) : ""}
      <div><h4>Note</h4>
        <textarea data-n="${esc(v.id)}" placeholder="Es. referral chiesta a Marco il 2/11, colloquio con il recruiter…">${esc(v.note || "")}</textarea></div>
    </div>`;
}

// --- eventi della lista (un solo ascoltatore per tipo, "delegato" dalla lista intera)
$("seg").addEventListener("click", e => {
  const b = e.target.closest("button[data-g]"); if(!b) return;
  gruppo = b.dataset.g; renderSaved();
});
$("saved").addEventListener("click", e => {
  // non aprire/chiudere toccando i controlli o la parte di dettaglio
  if(e.target.closest("select, a, textarea, input, button:not([data-r]), .det") && !e.target.closest("[data-r]")) return;
  const r = e.target.closest("[data-r]");
  if(r) return rimuovi(r.dataset.r);
  const t = e.target.closest("[data-toggle]");
  if(t){ const id = t.dataset.toggle; aperte.has(id) ? aperte.delete(id) : aperte.add(id); renderSaved(); }
});
$("saved").addEventListener("change", e => {
  const id = e.target.dataset.s; if(!id) return;
  const v = state.dec[id], nuovo = e.target.value;
  if(nuovo !== "da_fare" && !v.tc) v.tc = adesso();     // data della candidatura, la prima volta
  v.stato = nuovo; v.cand = nuovo !== "da_fare"; v.t = adesso();
  save(); render();
});
// le note si salvano mentre scrivi (senza ridisegnare, così non perdi il cursore)
$("saved").addEventListener("input", e => {
  const id = e.target.dataset.n; if(!id) return;
  state.dec[id].note = e.target.value; state.dec[id].t = adesso(); save();
});

// rimozione con possibilità di annullare per qualche secondo
let toastTimer = null;
function rimuovi(id){
  const prima = state.dec[id];
  state.dec[id] = {s:"scartata", t:adesso()}; aperte.delete(id); save(); render();
  mostraToast("Offerta rimossa", () => { state.dec[id] = {...prima, t:adesso()}; save(); render(); });
}
function mostraToast(testo, annulla){
  document.querySelector(".toast")?.remove(); clearTimeout(toastTimer);
  const el = document.createElement("div");
  el.className = "toast"; el.innerHTML = `<span>${esc(testo)}</span><button>Annulla</button>`;
  el.querySelector("button").onclick = () => { annulla(); el.remove(); };
  document.body.appendChild(el);
  toastTimer = setTimeout(() => el.remove(), 6000);
}

/* =====================================================================
   6b. TROVA LA RACCOMANDAZIONE (referral)
   Niente API né lettura di LinkedIn: solo link a ricerche LinkedIn già
   compilate, che apri tu con il tuo account, più un messaggio pronto
   da copiare. Il messaggio si può modificare e la tua versione resta
   salvata in questo browser (KEY_MSG), separata per inglese e italiano.
   ===================================================================== */
const KEY_MSG = "swipe-lavoro-messaggi";
const MSG_BASE = {
  en: `Hi {nome}, hope you're doing well! I saw the {ruolo} role at {azienda} in Dublin and I'm genuinely interested. I'm an Italian B2B SaaS sales rep (SDR/BDR) planning my move to Dublin. Would you be open to a quick chat about your experience at {azienda}, or to referring me if you think I could be a good fit? Here's the role: {link}. Thanks a lot!`,
  it: `Ciao {nome}, come stai? Ho visto la posizione {ruolo} in {azienda} a Dublino e mi interessa molto. Lavoro nelle vendite B2B SaaS (SDR/BDR) e sto pianificando il trasferimento a Dublino. Ti andrebbe una breve chiacchierata sulla tua esperienza in {azienda}, o di referenziarmi se pensi che possa essere in linea? Ecco l'annuncio: {link}. Grazie mille!`,
};
let linguaMsg = "en";
const messaggi = () => { try { return JSON.parse(localStorage.getItem(KEY_MSG)) || {}; } catch(e){ return {}; } };

// nome da cercare su LinkedIn: "Workvivo / Zoom" -> "Workvivo", "X (ex Twitter)" -> "X"
const nomeLinkedIn = a => (a || "").split("/")[0].replace(/\(.*?\)/g, "").replace(/tech hub/i, "").trim();

// ricerca persone su LinkedIn; reteMia = solo collegamenti di 1° e 2° grado
function linkPersone(parole, reteMia){
  const u = new URL("https://www.linkedin.com/search/results/people/");
  u.searchParams.set("keywords", parole);
  if(reteMia) u.searchParams.set("network", '["F","S"]');
  u.searchParams.set("origin", "FACETED_SEARCH");
  return u.toString();
}

function raccomandazioneHTML(v){
  const az = nomeLinkedIn(v.azienda);
  const ae = /account executive|\bae\b|sales executive/i.test(v.titolo || "");
  const capo = ae ? `${az} sales manager` : `${az} sales development manager`;
  const testo = (messaggi()[linguaMsg] || MSG_BASE[linguaMsg])
    .replaceAll("{ruolo}", v.titolo || "").replaceAll("{azienda}", az).replaceAll("{link}", v.url || "");
  return `
    <div><h4>Trova chi ti raccomanda</h4>
      <div class="btns">
        <a class="btn" target="_blank" rel="noopener" href="${esc(linkPersone(az, true))}">👥 I tuoi contatti (1° e 2°)</a>
        <a class="btn" target="_blank" rel="noopener" href="${esc(linkPersone(`${az} Italian Dublin`, false))}">🇮🇹 Italiani a Dublino</a>
        <a class="btn" target="_blank" rel="noopener" href="${esc(linkPersone(capo, false))}">🎯 ${ae ? "Sales manager" : "Manager SDR"}</a>
        <a class="btn" target="_blank" rel="noopener" href="${esc(linkPersone(`${az} recruiter EMEA`, false))}">🧑‍💼 Recruiter</a>
      </div>
      <p class="mini">Prima i contatti di 1° e 2° grado: chi ti conosce (o conosce chi ti conosce) risponde molto più spesso.</p>
    </div>
    <div><h4>Messaggio <span class="lang">
        <button data-l="en" class="${linguaMsg === "en" ? "on" : ""}">EN</button>
        <button data-l="it" class="${linguaMsg === "it" ? "on" : ""}">IT</button></span></h4>
      <textarea data-m="${esc(v.id)}" rows="6">${esc(testo)}</textarea>
      <div class="btns" style="margin-top:8px">
        <button class="btn pri" data-copia="${esc(v.id)}">Copia messaggio</button>
        <button class="btn" data-salvamsg="${esc(v.id)}" title="Usa questo testo come modello per tutte le offerte">Salva come modello</button>
        <button class="btn" data-resetmsg="1">Modello iniziale</button>
      </div>
      <p class="mini">Sostituisci {nome} prima di inviare. Nel modello puoi usare {nome}, {ruolo}, {azienda}, {link}.</p>
    </div>`;
}

$("saved").addEventListener("click", async e => {
  const l = e.target.closest("[data-l]");
  if(l){ linguaMsg = l.dataset.l; return renderSaved(); }
  const c = e.target.closest("[data-copia]");
  if(c){
    const ta = document.querySelector(`textarea[data-m="${CSS.escape(c.dataset.copia)}"]`);
    try { await navigator.clipboard.writeText(ta.value); c.textContent = "Copiato ✓"; }
    catch(err){ ta.select(); document.execCommand("copy"); c.textContent = "Copiato ✓"; }
    setTimeout(() => c.textContent = "Copia messaggio", 1800);
    return;
  }
  const m = e.target.closest("[data-salvamsg]");
  if(m){
    // il testo diventa modello: si rimettono i segnaposto al posto dei dati di questa offerta
    const v = state.dec[m.dataset.salvamsg];
    const ta = document.querySelector(`textarea[data-m="${CSS.escape(m.dataset.salvamsg)}"]`);
    let t = ta.value;
    if(v.url) t = t.replaceAll(v.url, "{link}");
    if(v.titolo) t = t.replaceAll(v.titolo, "{ruolo}");
    t = t.replaceAll(nomeLinkedIn(v.azienda), "{azienda}");
    const tutti = messaggi(); tutti[linguaMsg] = t;
    try { localStorage.setItem(KEY_MSG, JSON.stringify(tutti)); } catch(err){}
    m.textContent = "Salvato ✓"; setTimeout(() => m.textContent = "Salva come modello", 1800);
    return;
  }
  if(e.target.closest("[data-resetmsg]")){
    const tutti = messaggi(); delete tutti[linguaMsg];
    try { localStorage.setItem(KEY_MSG, JSON.stringify(tutti)); } catch(err){}
    renderSaved();
  }
});

   7. AVVIO: tab, pulsanti, tastiera, caricamento di jobs.json
   ===================================================================== */
function tab(which){
  $("t-deck").classList.toggle("on", which === "deck");
  $("t-saved").classList.toggle("on", which === "saved");
  $("v-deck").classList.toggle("hidden", which !== "deck");
  $("v-saved").classList.toggle("hidden", which !== "saved");
}
$("t-deck").onclick = () => tab("deck");
$("t-saved").onclick = () => tab("saved");
$("b-yes").onclick = () => decidi("salvata", 1);
$("b-no").onclick = () => decidi("scartata", -1);
$("b-undo").onclick = annulla;
addEventListener("keydown", e => {            // scorciatoie da tastiera sul Mac
  if($("v-deck").classList.contains("hidden")) return;
  if(e.key === "ArrowRight") decidi("salvata", 1);
  else if(e.key === "ArrowLeft") decidi("scartata", -1);
  else if(e.key.toLowerCase() === "z" || e.key === "Backspace") annulla();
});

/* =====================================================================
   8. SINCRONIZZAZIONE TRA DISPOSITIVI (telefono, Mac, …)
   Le scelte vengono salvate anche in un file su GitHub (SYNC_FILE sul ramo
   SYNC_BRANCH), così ogni dispositivo vede le stesse salvate/scartate.
   - Serve un token GitHub incollato una volta per dispositivo (pannello ☁︎)
   - Se manca la rete, le scelte restano nel browser e partono appena torna
   - Unione: per ogni offerta vince la decisione con data (t) più recente
   ===================================================================== */
let syncSha = null, timerInvio = null, inviando = false, daInviare = false;
const token = () => { try { return localStorage.getItem(KEY_TOKEN) || ""; } catch(e){ return ""; } };
const API = `https://api.github.com/repos/${SYNC_REPO}`;
const hdr = () => ({"Authorization": `Bearer ${token()}`, "Accept": "application/vnd.github+json"});

function statoSync(testo, classe){
  $("sync-txt").textContent = testo;
  $("b-sync").className = "sync " + (classe || "");
}

// testo <-> base64 rispettando accenti ed emoji
const b64enc = s => btoa(String.fromCharCode(...new TextEncoder().encode(s)));
const b64dec = b => new TextDecoder().decode(Uint8Array.from(atob(b.replace(/\n/g,"")), c => c.charCodeAt(0)));

// unisce le decisioni remote con quelle locali: vince la più recente
function unisci(remote){
  let cambiato = false;
  for(const [id, v] of Object.entries(remote || {})){
    const loc = state.dec[id];
    if(!loc || (v.t || "") > (loc.t || "")){ state.dec[id] = v; cambiato = true; }
  }
  return cambiato;
}

// crea il ramo "decisioni" la prima volta (parte dall'ultima versione di main)
async function creaRamo(){
  const m = await fetch(`${API}/git/ref/heads/main`, {headers: hdr()}).then(r => r.json());
  await fetch(`${API}/git/refs`, {method:"POST", headers: hdr(),
    body: JSON.stringify({ref:`refs/heads/${SYNC_BRANCH}`, sha: m.object.sha})});
}

// scarica il file comune e lo unisce a quello locale
async function scarica(){
  if(!token()) return statoSync("solo questo dispositivo");
  const r = await fetch(`${API}/contents/${SYNC_FILE}?ref=${SYNC_BRANCH}&t=${Date.now()}`, {headers: hdr(), cache:"no-store"});
  if(r.status === 401 || r.status === 403) throw new Error("token non valido o senza permessi");
  if(r.status === 404){ syncSha = null; return false; }      // file (o ramo) non ancora creato
  if(!r.ok) throw new Error("GitHub ha risposto " + r.status);
  const d = await r.json();
  syncSha = d.sha;
  const cambiato = unisci(JSON.parse(b64dec(d.content)).dec);
  if(cambiato){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){} }
  return cambiato;
}

// invia lo stato completo; se qualcun altro ha scritto nel frattempo, riscarica e riprova
async function invia(){
  if(!token()) return;
  if(inviando){ daInviare = true; return; }
  inviando = true; statoSync("salvo…");
  try {
    for(let tentativo = 0; tentativo < 3; tentativo++){
      await scarica();
      const body = {message: `scelte aggiornate ${adesso()}`, branch: SYNC_BRANCH,
                    content: b64enc(JSON.stringify({dec: state.dec}, null, 1))};
      if(syncSha) body.sha = syncSha;
      let r = await fetch(`${API}/contents/${SYNC_FILE}`, {method:"PUT", headers: hdr(), body: JSON.stringify(body)});
      if(r.status === 404 && tentativo === 0){ await creaRamo(); continue; }   // ramo mancante
      if(r.status === 409 || r.status === 422) continue;                       // conflitto: riprova
      if(!r.ok) throw new Error("GitHub ha risposto " + r.status);
      syncSha = (await r.json()).content.sha;
      statoSync("sincronizzato", "ok");
      return;
    }
    throw new Error("troppi conflitti, riprovo più tardi");
  } catch(e){
    statoSync("non sincronizzato", "err"); $("panel-msg").textContent = "Ultimo errore: " + e.message;
  } finally {
    inviando = false;
    if(daInviare){ daInviare = false; programmaInvio(); }
  }
}

function programmaInvio(){
  if(!token()) return;
  statoSync("da salvare…");
  clearTimeout(timerInvio);
  timerInvio = setTimeout(invia, SYNC_ATTESA);
}

// all'apertura e ogni volta che torni sulla pagina: scarica le scelte degli altri dispositivi
async function aggiornaDaRemoto(){
  if(!token()) return statoSync("solo questo dispositivo");
  try {
    statoSync("aggiorno…");
    if(await scarica()) render();
    statoSync("sincronizzato", "ok");
  } catch(e){
    statoSync("non sincronizzato", "err"); $("panel-msg").textContent = "Ultimo errore: " + e.message;
  }
}
document.addEventListener("visibilitychange", () => {
  if(document.visibilityState === "visible") aggiornaDaRemoto();
  else if(timerInvio){ clearTimeout(timerInvio); invia(); }   // esci dall'app: invia subito
});

// pannello token
$("b-sync").onclick = () => $("panel").classList.toggle("hidden");
$("tok-save").onclick = async () => {
  const v = $("tok").value.trim(); if(!v) return;
  try { localStorage.setItem(KEY_TOKEN, v); } catch(e){}
  $("tok").value = ""; $("panel-msg").textContent = "Collegato. Sincronizzo…";
  await aggiornaDaRemoto(); await invia();
  if($("b-sync").classList.contains("ok")){ $("panel-msg").textContent = "Fatto: questo dispositivo è sincronizzato."; render();
    setTimeout(() => $("panel").classList.add("hidden"), 1500); }
};
$("tok-del").onclick = () => {
  try { localStorage.removeItem(KEY_TOKEN); } catch(e){}
  $("panel-msg").textContent = "Scollegato: le scelte restano solo su questo dispositivo.";
  statoSync("solo questo dispositivo");
};

// "?"+Date.now() evita che il telefono mostri una copia vecchia del file
fetch("jobs.json?" + Date.now()).then(r => r.json()).then(d => {
  meta = d; jobs = d.offerte || [];
  $("upd").textContent = d.aggiornato ? `aggiornato ${fa(d.aggiornato)}` : "";
  const prob = (d.problemi || []);
  // escluse = altra lingua o mercato non mio (UK, Americhe...); i dati vecchi usavano scartate_lingua
  const sc = d.escluse || (d.scartate_lingua || []).map(x => ({...x, motivo: x.lingua}));
  $("foot").innerHTML = `${jobs.length} offerte attive · ${d.fonti_lette}/${d.fonti_totali} aziende lette · v${VERSIONE}`
    + (sc.length ? `<details><summary>${sc.length} escluse (altra lingua o mercato)</summary><ul>${sc.map(s=>`<li>${esc(s.azienda)}: ${s.url ? `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.titolo)}</a>` : esc(s.titolo)} <i>(${esc(s.motivo)})</i></li>`).join("")}</ul></details>` : "")
    + (prob.length ? `<details><summary>${prob.length} aziende non lette</summary><ul>${prob.map(p=>`<li>${esc(p)}</li>`).join("")}</ul></details>` : "");
  render();
  aggiornaDaRemoto();
}).catch(() => {
  $("upd").textContent = "";
  $("foot").textContent = `v${VERSIONE}`;
  $("deck").innerHTML = `<div class="empty-state"><div><b>Ancora nessun dato</b>Il primo giro di ricerca non è ancora finito. Riprova tra qualche minuto.</div></div>`;
});
